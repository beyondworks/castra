name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Shell syntax
        run: bash -n install.sh hooks/castra-budget.sh tests/run.sh
      - name: Run checks
        run: ./tests/run.sh
